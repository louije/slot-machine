name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -p 1 keeps the two packages sequential: both spawn real daemons, apps
      # and agents, and running them at once doubles the process pressure on a
      # small runner for no benefit. Within a package the default parallelism is
      # fine — the suite has been run at 2x CPU oversubscription without a
      # failure.
      - name: Test
        run: go test -p 1 ./...
