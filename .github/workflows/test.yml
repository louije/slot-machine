name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -p 1 keeps the two packages sequential: both spawn real daemons, apps
      # and agents, and running them at once doubles the process pressure on a
      # small runner for no benefit. Within a package the default parallelism is
      # fine — the suite has been run at 2x CPU oversubscription without a
      # failure.
      - name: Test
        run: go test -p 1 ./...

  # The conformance suite is the spec's teeth. It runs against every
  # implementation, so neither one can quietly become the definition of the spec.
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        implementation: [go, ruby]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # A floor, not a requirement: the harness and impl/ruby use nothing newer
      # than Ruby 2.5 semantics, so raising this is safe.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # Fails if a requirement in the spec has no test, or a test cites a
      # requirement the spec no longer declares. Needs no orchestrator.
      - name: Spec coverage
        run: ruby spec/conformance/coverage_test.rb

      - name: Conformance (${{ matrix.implementation }})
        run: ruby spec/conformance/conformance_test.rb
        env:
          ORCHESTRATOR_ADAPTER: spec/conformance/adapters/${{ matrix.implementation }}
